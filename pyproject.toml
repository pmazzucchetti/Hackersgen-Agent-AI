[project]
name = "hackersgen-agent-ai"
version = "0.1.0"
description = "Live HackersGen 2026 sugli AI Agent: l'assistente scolastico dei laboratori"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "openai==3.51.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "registro"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
